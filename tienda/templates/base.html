<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda - Productos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #2c3e50; color: white; }
        .btn { display: inline-block; padding: 8px 16px; background: #2980b9; color: white;
               text-decoration: none; border: none; border-radius: 4px; cursor: pointer; font-size: 1em; }
        .btn-gris { background: #7f8c8d; }
        .form-campo { margin-bottom: 15px; }
        .form-campo label { display: block; font-weight: bold; margin-bottom: 4px; }
        .form-campo input { padding: 6px; width: 100%; max-width: 350px; }
        .error { color: #c0392b; font-size: 0.9em; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; color: #2980b9; font-weight: bold; text-decoration: none; }
        .btn-rojo { background: #c0392b; }
        .btn-verde { background: #27ae60; }
        .acciones a { margin-right: 8px; }
        .activo { color: #27ae60; font-weight: bold; }
        .inactivo { color: #c0392b; font-weight: bold; }
        .vacio { padding: 20px; background: #f9f2d0; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Sistema de productos</h1>
    <nav>
        <a href="{% url 'lista_productos' %}">Productos</a>
        <a href="{% url 'lista_categorias' %}">Categorías</a>
    </nav>
    {% block contenido %}{% endblock %}
</body>
</html>
